name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build on Paper 26.2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build against current Paper 26.2
        run: ./gradlew clean build --no-daemon --refresh-dependencies

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: LevelBlock-${{ github.sha }}
          path: |
            build/libs/LevelBlock-*.jar
            build/distributions/LevelBlock-Resourcepack-*.zip
            build/reports/tests/test/
            build/reports/jacoco/test/
          if-no-files-found: error
          retention-days: 14
