name: Beta Release

on:
  push:
    tags:
      - "v*.*.*-beta.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish beta
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate beta tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Expected a tag such as v0.1.0-beta.1" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build against current Paper 26.2
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          export RELEASE_VERSION="${RELEASE_VERSION#v}"
          ./gradlew clean build --no-daemon --refresh-dependencies

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          plugin_jar="build/libs/LevelBlock-${version}.jar"
          resource_pack="build/distributions/LevelBlock-Resourcepack-${version}.zip"

          test -f "${plugin_jar}"
          test -f "${resource_pack}"

          gh release create "${GITHUB_REF_NAME}" \
            "${plugin_jar}#LevelBlock plugin" \
            "${resource_pack}#LevelBlock resource pack" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "LevelBlock ${version}"
